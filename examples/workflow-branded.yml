# Branded variant: posts the review as your own GitHub App (custom name + avatar)
# instead of the default github-actions[bot].
#
# This is OPTIONAL. The default (examples/workflow.yml) needs no App and works as-is.
#
# Why: GitHub only shows a custom name/logo for tokens that carry a custom identity
# (an App or a PAT). The default GITHUB_TOKEN cannot be branded.
#
# One-time App setup:
#   1. Create a GitHub App: name + logo; permissions Pull requests: Read & write,
#      Contents: Read, Issues: Read & write. Webhook OFF, subscribe to no events.
#   2. Install the App on this repo.
#   3. Add repository secrets APP_ID and APP_PRIVATE_KEY (full .pem contents).
#
# Alternative (simpler, one secret): skip the App and use a bot user + PAT —
# store a PAT as REVIEW_BOT_TOKEN and pass `github-token: ${{ secrets.REVIEW_BOT_TOKEN }}`
# directly (no create-github-app-token step needed).

name: ai-code-review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: AI code review (branded)
        uses: nethbotheju/ai-code-review@v1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          api-type: openai            # openai | openai-compatible | anthropic
          model: gpt-4o               # your model
          # base-url: 'http://opencode.ai/zen/go/v1'   # set ONLY for openai-compatible
          api-key: ${{ secrets.AI_CODE_REVIEW_LLM_API_KEY }}
          # auto-review: 'true'      # uncomment to review on open/reopen/push automatically
          # extra-instructions: 'Follow the project's naming conventions...'
