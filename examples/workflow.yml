# AI code review — standard review (single-pass over the diff).
# Copy into your repo at .github/workflows/ai-code-review.yml and pin the action to @v1.
#
# Triggers: add the "ai-review" label to a PR, or comment "/ai-review".
# Set auto-review: 'true' to also review on open / reopen / push.
#
# Required secret: AI_CODE_REVIEW_LLM_API_KEY (your provider API key).

name: ai-code-review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: nethbotheju/ai-code-review@v1
        with:
          api-type: openai            # openai | openai-compatible | anthropic
          model: gpt-4o
          api-key: ${{ secrets.AI_CODE_REVIEW_LLM_API_KEY }}
          # auto-review: 'true'         # review on open/reopen/push automatically
          # extra-instructions: '...'   # extra guidance appended to the prompt
