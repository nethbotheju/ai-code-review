# AI code review — agent review (investigates the repo with read-only tools before reviewing).
# Copy into your repo at .github/workflows/ai-code-review.yml and pin the action to @v1.
#
# Triggers: add the "ai-review" label to a PR, or comment "/ai-review".
# Set auto-review: 'true' to also review on open / reopen / push.
#
# Required secret: AI_CODE_REVIEW_LLM_API_KEY (your provider API key).

name: ai-code-review

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write          # lets actions/cache save the agent install
    steps:
      # Agent mode installs the tooling on first run; cache the install dir
      # so it is reused across runs (pi versions live side-by-side, so a
      # static key never needs bumping when pi-version changes).
      - name: Cache pi agent install
        uses: actions/cache@v5
        with:
          path: ~/.cache/ai-code-review-pi
          key: ai-code-review-pi

      - uses: nethbotheju/ai-code-review@v1
        with:
          api-type: openai            # openai | openai-compatible | anthropic
          model: gpt-4o
          api-key: ${{ secrets.AI_CODE_REVIEW_LLM_API_KEY }}
          review-mode: agent          # investigate the repo with tools before reviewing
          # pi-version: '0.82.1'         # override the bundled @earendil-works/pi-coding-agent version
          # pi-timeout-ms: '600000'      # hard timeout for an agent run (ms)
          # auto-review: 'true'
          # extra-instructions: '...'
