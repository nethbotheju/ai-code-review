# Self-test: this action reviews pull requests on its own repository.
# Opt-in — only runs when the trigger label/command is used, and requires the
# repository secret AI_CODE_REVIEW_LLM_API_KEY to be set. Edit the provider/model
# below to match the key you configured.

name: self-test

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this action locally
        uses: ./
        with:
          api-type: openai
          model: gpt-4o
          # base-url: ''   # set if testing openai-compatible
          api-key: ${{ secrets.AI_CODE_REVIEW_LLM_API_KEY }}
