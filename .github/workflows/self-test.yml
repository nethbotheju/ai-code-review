# Self-test: this action reviews pull requests on its own repository.
# Opt-in — only runs when the trigger label/command is used, and requires the
# following repository secrets to be set: LLM_API_TYPE, LLM_MODEL, LLM_API_KEY
# (and LLM_BASE_URL for openai-compatible providers).

name: self-test

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-review'))
      || (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai-review') &&
        github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this action locally
        uses: ./
        with:
          api-type: ${{ secrets.LLM_API_TYPE }}
          base-url: ${{ secrets.LLM_BASE_URL }}
          model: ${{ secrets.LLM_MODEL }}
          api-key: ${{ secrets.LLM_API_KEY }}
